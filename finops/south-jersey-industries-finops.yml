principles:
  - name: Visibility
    description: Not applicable on a developer surface; gas-service consumption is metered at the customer
      premise and reported on the utility bill, not via an API.
  - name: Allocation
    description: Not applicable - SJI is a regulated utility holding company without developer/tenant
      cost-allocation semantics.
  - name: Optimization
    description: Not applicable at the API/FinOps layer.
  - name: Accountability
    description: Customer-level accountability is governed by the utility tariff and the New Jersey Board
      of Public Utilities, not by a developer/tenant contract.
