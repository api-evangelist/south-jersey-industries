description: 'FOCUS-aligned FinOps placeholder for South Jersey Industries. SJI is a regulated natural-gas
  utility holding company with no developer billing surface; this artifact captures the publisher entity
  only.'
sources:
  - https://www.sjindustries.com/
notes: SJI does not expose a public developer API or usage-based billing surface. Meters cannot be reconciled
  because there are no published API consumption units. Customer-facing rates are utility tariffs filed
  with state regulators rather than FinOps meters.
